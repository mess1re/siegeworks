// Seeds only the native disposable GameTest world after reset and before config loading.
// Fabric uses runLifecycleTest to exercise the ordinary server lifecycle and both config scopes.
// Use -PgameTestNamespaces=siegeworks_config,siegeworks_config_upgrade with this init script.
gradle.projectsEvaluated {
    allprojects { project ->
        if (project.extensions.extraProperties.has('gameTestDirectory') && project.tasks.findByName('runGameTestServer') != null) {
            def gameDirectory = project.extensions.extraProperties.get('gameTestDirectory')
            def seed = project.tasks.register('seedConfigMigration', Copy) {
                dependsOn(project.tasks.named('resetGameTestWorld'))
                from(project.rootProject.file('src/gametest/resources/config-migration'))
                into(new File(gameDirectory, 'world/serverconfig'))
            }
            project.tasks.matching { it.name == 'runGameTestServer' }.configureEach {
                dependsOn(seed)
            }
        }
    }
}
