name: release

on:
  push:
    tags:
      - "[0-9]*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag
        required: true
        type: string
      target:
        description: Where to publish
        required: true
        default: all
        type: choice
        options:
          - all
          - modrinth

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'mess1re/siegeworks'
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      CURSEFORGE_PROJECT_ID: "1713906"
      MODRINTH_PROJECT_ID: "ipPcxTnH"
      PUBLISH_TARGET: ${{ inputs.target || 'all' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Check release version
        shell: bash
        run: |
          version=$(sed -n 's/^mod\.version = "\(.*\)"/\1/p' stonecutter.properties.toml)

          if [[ -z "$version" ]]; then
            echo "Could not read mod.version from stonecutter.properties.toml"
            exit 1
          fi

          if [[ "$RELEASE_TAG" != "$version" ]]; then
            echo "Tag '$RELEASE_TAG' does not match mod.version '$version'"
            exit 1
          fi

      - name: Read changelog
        id: changelog
        shell: bash
        run: |
          if ! changelog=$(awk -v version="$RELEASE_TAG" '
            $0 == "## " version { found = 1; next }
            found && /^## / { exit }
            found { print }
            END { if (!found) exit 1 }
          ' CHANGELOG.md); then
            echo "::error::CHANGELOG.md has no section for $RELEASE_TAG"
            exit 1
          fi

          if ! grep -q '[^[:space:]]' <<< "$changelog"; then
            echo "::error::The changelog section for $RELEASE_TAG is empty"
            exit 1
          fi

          {
            echo 'body<<CHANGELOG_EOF'
            printf '%s\n' "$changelog"
            echo 'CHANGELOG_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Build Axiomata
        shell: bash
        run: |
          version="$(sed -n 's/^deps.axiomata = "\(.*\)"/\1/p' stonecutter.properties.toml | head -n 1)"
          git clone --quiet https://github.com/mess1re/axiomata.git "$RUNNER_TEMP/axiomata"
          git -C "$RUNNER_TEMP/axiomata" checkout --quiet "$version"
          cd "$RUNNER_TEMP/axiomata"
          chmod +x gradlew
          for target in 1.20.1-forge 1.21.1-neoforge; do
            GROUP=com.github.mess1re.axiomata ARTIFACT="$target" VERSION="$version" \
              ./gradlew ":$target:publishToMavenLocal"
          done

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew clean build

      - name: Create GitHub release
        if: env.PUBLISH_TARGET != 'modrinth'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_CHANGELOG: ${{ steps.changelog.outputs.body }}
        run: |
          tag="$RELEASE_TAG"
          forge_jar="versions/1.20.1-forge/build/libs/siegeworks-forge-${tag}+1.20.1.jar"
          neoforge_jar="versions/1.21.1-neoforge/build/libs/siegeworks-neoforge-${tag}+1.21.1.jar"
          release_flags=()

          if [[ "$tag" == *-* ]]; then
            release_flags+=(--prerelease)
          fi

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" \
              "$forge_jar" \
              "$neoforge_jar" \
              --clobber
            gh release edit "$tag" --notes "$RELEASE_CHANGELOG"
          else
            gh release create "$tag" \
              "$forge_jar" \
              "$neoforge_jar" \
              --verify-tag \
              --title "$tag" \
              --notes "$RELEASE_CHANGELOG" \
              "${release_flags[@]}"
          fi

      - name: Publish to CurseForge
        if: env.PUBLISH_TARGET != 'modrinth'
        shell: bash
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ -z "$CURSEFORGE_TOKEN" ]]; then
            echo "::error::Add CURSEFORGE_TOKEN to the repository Actions secrets."
            exit 1
          fi

          tag="$RELEASE_TAG"
          forge_jar="versions/1.20.1-forge/build/libs/siegeworks-forge-${tag}+1.20.1.jar"
          neoforge_jar="versions/1.21.1-neoforge/build/libs/siegeworks-neoforge-${tag}+1.21.1.jar"
          changelog=$(gh release view "$tag" --json body --jq '.body // ""')
          release_type="release"

          upload_file() {
            local file="$1"
            local minecraft_version="$2"
            local loader="$3"
            local metadata

            metadata=$(jq -n \
              --arg changelog "$changelog" \
              --arg minecraft_version "$minecraft_version" \
              --arg loader "$loader" \
              --arg release_type "$release_type" \
              '{
                changelog: $changelog,
                changelogType: "markdown",
                gameVersionNames: [
                  $minecraft_version,
                  $loader,
                  "Client",
                  "Server"
                ],
                releaseType: $release_type,
                relations: {
                  projects: (
                    [
                      {slug: "axiomata", projectID: 1713796, type: "requiredDependency"},
                      {slug: "geckolib", type: "requiredDependency"},
                      {slug: "architectury-api", type: "requiredDependency"}
                    ]
                    + (if $loader == "Forge" then [
                        {slug: "recruits", type: "optionalDependency"},
                        {slug: "recruits-rts-command", projectID: 1713913, type: "optionalDependency"}
                      ] else [] end)
                  )
                }
              }')

            curl --fail-with-body \
              --request POST \
              --header "X-Api-Token: $CURSEFORGE_TOKEN" \
              --form-string "metadata=$metadata" \
              --form "file=@$file" \
              "https://minecraft.curseforge.com/api/projects/${CURSEFORGE_PROJECT_ID}/upload-file"
          }

          upload_file \
            "$forge_jar" \
            "1.20.1" \
            "Forge"

          upload_file \
            "$neoforge_jar" \
            "1.21.1" \
            "NeoForge"

      - name: Publish to Modrinth
        shell: bash
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          RELEASE_CHANGELOG: ${{ steps.changelog.outputs.body }}
        run: |
          if [[ -z "$MODRINTH_TOKEN" ]]; then
            echo "::error::Add MODRINTH_TOKEN to the repository Actions secrets."
            exit 1
          fi

          tag="$RELEASE_TAG"
          forge_jar="versions/1.20.1-forge/build/libs/siegeworks-forge-${tag}+1.20.1.jar"
          neoforge_jar="versions/1.21.1-neoforge/build/libs/siegeworks-neoforge-${tag}+1.21.1.jar"
          version_type="release"

          if [[ "$tag" == *-alpha* ]]; then
            version_type="alpha"
          elif [[ "$tag" == *-beta* ]]; then
            version_type="beta"
          fi

          existing_versions=$(curl --silent --show-error \
            --header "Authorization: $MODRINTH_TOKEN" \
            --header "User-Agent: mess1re/siegeworks-release-workflow (github.com/mess1re/siegeworks)" \
            "https://api.modrinth.com/v2/project/${MODRINTH_PROJECT_ID}/version")

          if ! jq -e 'type == "array"' <<< "$existing_versions" >/dev/null; then
            existing_versions='[]'
          fi

          upload_file() {
            local file="$1"
            local minecraft_version="$2"
            local loader="$3"
            local loader_id="$4"
            local version_number="${tag}+${loader_id}.${minecraft_version}"
            local metadata

            if jq -e --arg version "$version_number" \
              '.[] | select(.version_number == $version)' \
              <<< "$existing_versions" >/dev/null; then
              echo "Modrinth version $version_number already exists; skipping."
              return
            fi

            metadata=$(jq -n \
              --arg name "Siegeworks ${tag} — ${loader} ${minecraft_version}" \
              --arg version_number "$version_number" \
              --arg changelog "$RELEASE_CHANGELOG" \
              --arg game_version "$minecraft_version" \
              --arg loader "$loader_id" \
              --arg version_type "$version_type" \
              --arg project_id "$MODRINTH_PROJECT_ID" \
              '{
                name: $name,
                version_number: $version_number,
                changelog: $changelog,
                dependencies: (
                  [
                    {project_id: "VHAvNpmA", dependency_type: "required"},
                    {project_id: "8BmcQJ2H", dependency_type: "required"},
                    {project_id: "lhGA9TYQ", dependency_type: "required"}
                  ]
                  + (if $loader == "forge" then [
                      {project_id: "WOg9lm4u", dependency_type: "optional"},
                      {project_id: "918CHVyN", dependency_type: "optional"}
                    ] else [] end)
                ),
                game_versions: [$game_version],
                version_type: $version_type,
                loaders: [$loader],
                featured: true,
                status: "listed",
                project_id: $project_id,
                file_parts: ["file"],
                primary_file: "file",
                environment: "client_and_server"
              }')

            curl --fail-with-body \
              --request POST \
              --header "Authorization: $MODRINTH_TOKEN" \
              --header "User-Agent: mess1re/siegeworks-release-workflow (github.com/mess1re/siegeworks)" \
              --form-string "data=$metadata" \
              --form "file=@$file" \
              "https://api.modrinth.com/v2/version"
          }

          upload_file \
            "$forge_jar" \
            "1.20.1" \
            "Forge" \
            "forge"

          upload_file \
            "$neoforge_jar" \
            "1.21.1" \
            "NeoForge" \
            "neoforge"

  update-notices:
    if: github.repository == 'mess1re/siegeworks'
    needs: release
    runs-on: ubuntu-latest
    concurrency:
      group: siegeworks-update-notices
      cancel-in-progress: false
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

    steps:
      - name: Check out default branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Advance update notices
        run: python scripts/update_notices.py "$RELEASE_TAG"

      - name: Save update notices
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git add updates/forge.json updates/neoforge.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m "update version notices for $RELEASE_TAG"
          git push origin "HEAD:$DEFAULT_BRANCH"
